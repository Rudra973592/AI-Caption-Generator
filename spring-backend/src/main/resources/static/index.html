<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Caption Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    margin: 0;
}

h1 {
    color: #38bdf8;
    margin-bottom: 30px;
}

.subtitle {
    font-size: 18px;
    color: #94a3b8;   /* soft gray-blue */
    margin-top: -10px;
    margin-bottom: 25px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.container {
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
    width: 400px;
}

button {
    margin-top: 15px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: black;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(56,189,248,0.5);
}

.mode-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

.mode-card {
    background: #0f172a;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    width: 120px;
    border: 2px solid transparent;
    transition: 0.3s;
}

.mode-card img {
    width: 65px;
    transition: 0.3s;
    margin-bottom: 10px;
}

.mode-card.active {
    border: 2px solid #38bdf8;
    background: #1e293b;
}

.mode-card:hover {
    transform: scale(1.05);
}

#fileCount {
    margin-top: 10px;
    font-size: 14px;
    color: #cbd5f5;
}

#loading {
    margin-top: 15px;
}

.grid {
    margin-top: 40px;
    width: 80%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    justify-items: center;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 15px;
    width: 220px;
}

img {
    width: 100%;
    border-radius: 10px;
}

.caption {
    margin-top: 10px;
    font-size: 14px;
    color: #cbd5f5;
    text-transform: capitalize;
}
</style>


</head>

<body>
<div class="main">

<h1>AI Caption Generator</h1>
<p class="subtitle">
    Generate captions for real and anime images using AI
</p>

<div class="container">

<!-- Hidden file input -->
<input type="file" id="images" multiple hidden>

<!-- Custom button -->
<button onclick="document.getElementById('images').click()">
    Upload Images
</button>

<p id="fileCount"></p>

<!-- Mode Selection -->
<div class="mode-container">
    <div class="mode-card active" onclick="selectMode('real', this)">
        <img src="real_mode.png">
        <p>Real Mode</p>
    </div>

    <div class="mode-card" onclick="selectMode('anime', this)">
        <img src="vecteezy_man-silhouette-profile-picture-anime-style_.jpg">
        <p>Anime Mode</p>
    </div>
</div>

<button onclick="uploadImages()">Generate Captions</button>

</div>

<p id="loading" style="display:none;">⏳ Generating captions...</p>

<div class="grid" id="result"></div>

<button id="downloadBtn" onclick="downloadCaptions()" style="display:none;">
    Download Captions
</button>

<script>

let selectedMode = "real";
let lastCaptions = [];
let lastFiles = [];

// Mode selector
function selectMode(mode, element) {
    selectedMode = mode;

    document.querySelectorAll(".mode-card").forEach(card => {
        card.classList.remove("active");
    });

    element.classList.add("active");
}

// File count display
document.getElementById("images").addEventListener("change", function() {
    document.getElementById("fileCount").innerText =
        this.files.length + " file(s) selected";
});

async function uploadImages() {

    const files = document.getElementById("images").files;
    const loading = document.getElementById("loading");

    if (files.length === 0) {
        alert("Select images first!");
        return;
    }

    loading.style.display = "block";

    const formData = new FormData();

    for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
    }

    formData.append("mode", selectedMode);

    const response = await fetch("/upload-multiple", {
        method: "POST",
        body: formData
    });

    const captions = await response.json();

    loading.style.display = "none";

    displayResults(files, captions);
}

function displayResults(files, captions) {

    lastCaptions = captions;
    lastFiles = files;

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";

    for (let i = 0; i < files.length; i++) {

        const reader = new FileReader();

        reader.onload = function(e) {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <img src="${e.target.result}">
                <div class="caption">${captions[i]}</div>
            `;

            resultDiv.appendChild(card);
        };

        reader.readAsDataURL(files[i]);
    }

    document.getElementById("downloadBtn").style.display = "inline-block";
}

async function downloadCaptions() {

    const zip = new JSZip();

    for (let i = 0; i < lastCaptions.length; i++) {

        const file = lastFiles[i];
        const baseName = file.name.substring(0, file.name.lastIndexOf(".")) || file.name;

        zip.file(baseName + ".txt", lastCaptions[i]);
    }

    const content = await zip.generateAsync({ type: "blob" });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(content);
    link.download = "captions.zip";
    link.click();
}

</script>

</div>
</body>
</html>
